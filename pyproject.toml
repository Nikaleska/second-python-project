[project]
name = "hexlet-code"
version = "0.1.0"
description = "Compares two configuration files and shows a difference"
readme = "README.md"
authors = [
    { name = "nikaleska.github.io", email = "sansatik@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gendiff"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
